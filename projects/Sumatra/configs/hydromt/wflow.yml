steps:
- setup_config:
    data:
      time.starttime: '2001-01-01T00:00:00'
      time.endtime: '2001-12-31T00:00:00'
      time.timestepsecs: 86400
      model.snow__flag: false
      model.snow_gravitational_transport__flag: false
      input.path_forcing: inmaps.nc
      output.netcdf_grid.path: output.nc
      output.netcdf_grid.compressionlevel: 1
      output.netcdf_grid.variables.river_water__volume_flow_rate: river_q

- setup_basemaps:
    region:
      subbasin: outlet_sumatra
      uparea: 10.0
    hydrography_fn: merit_sumatra
    basin_index_fn: null
    res: 0.008333333333333333
    upscale_method: ihu

- setup_rivers:
    hydrography_fn: merit_sumatra
    river_geom_fn: river_geom
    river_upa: 50
    rivdph_method: powlaw
    slope_len: 2000
    min_rivlen_ratio: 0.0
    min_rivdph: 1.0
    min_rivwth: 1.0
    smooth_len: 5000
    elevtn_map: land_elevation
    river_routing: kinematic_wave

- setup_river_roughness: {}

- setup_lulcmaps:
    lulc_fn: landuse_sumatra
    lulc_mapping_fn: esa_worldcover_mapping_default

- setup_laimaps:
    lai_fn: lai_sumatra

- setup_soilmaps:
    soil_fn: soilgrids_2020
    ptf_ksatver: brakensiek
    wflow_thicknesslayers:
    - 100
    - 300
    - 800

- setup_constant_pars:
    subsurface_water__horizontal_to_vertical_saturated_hydraulic_conductivity_ratio: 100
    soil_surface_water__infiltration_reduction_parameter: 0.038
    vegetation_canopy_water__mean_evaporation_to_mean_precipitation_ratio: 0.11
    compacted_soil_surface_water__infiltration_capacity: 10
    soil_water_saturated_zone_bottom__max_leakage_volume_flux: 0
    soil_wet_root__sigmoid_function_shape_parameter: -500



- setup_outlets:
    river_only: true
    toml_output: csv
    gauge_toml_header:
    - river_q
    gauge_toml_param:
    - river_water__volume_flow_rate
